<!doctype html>
<html lang="ms" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1FA">
<meta name="color-scheme" content="light only">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prof. Teh Ling">
<meta name="format-detection" content="telephone=no">
<title>Jadual pemerhatian | Prof. Teh Ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --ink:#14203A; --muted:#5D6B85; --line:rgba(20,32,58,.10);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.85);
  --field:rgba(255,255,255,.65);
  --accent:#3559E0; --accent2:#7A4FE0; --accent-soft:rgba(53,89,224,.10); --on-accent:#FFFFFF;
  --tile-top:linear-gradient(135deg,#FF6B5E,#E8457A);
  --amber:#F2A93B; --amber-soft:rgba(255,214,120,.28); --amber-ink:#5A3A00;
  --green:#14935A; --red:#D23E35;
  --shadow:0 1px 1px rgba(255,255,255,.9) inset,0 -1px 0 rgba(20,32,58,.04) inset,0 10px 30px -8px rgba(40,60,120,.18),0 2px 6px rgba(40,60,120,.06);
  --blur:saturate(170%) blur(18px);
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light only; box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#EEF1FA}
body{-webkit-tap-highlight-color:transparent;margin:0;min-height:100%;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;background:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{touch-action:manipulation}
html.lock{overflow:hidden}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Ambient mesh behind the glass (fixed layer, iOS-safe) */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(60% 45% at 8% 0%,#BFD4FF 0%,transparent 70%),
  radial-gradient(55% 40% at 100% 12%,#E3CCFF 0%,transparent 70%),
  radial-gradient(60% 45% at 85% 100%,#FFD9C7 0%,transparent 70%),
  radial-gradient(50% 40% at 0% 85%,#C6F0E6 0%,transparent 70%),
  linear-gradient(180deg,#F3F5FC,#EEF1FA)}
.sky{transform:translateZ(0);pointer-events:none}
.sky::before,.sky::after{content:"";position:absolute;border-radius:50%;opacity:.5}
.sky::before{width:360px;height:360px;left:-140px;top:80px;background:radial-gradient(closest-side,#9DB8FF,rgba(157,184,255,0))}
.sky::after{width:320px;height:320px;right:-120px;top:300px;background:radial-gradient(closest-side,#D9B8FF,rgba(217,184,255,0))}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(255,255,255,.58));border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.92);--glass-strong:#fff}
}

/* Header */
.band{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 16px}
.band .inner{max-width:620px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.band p{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.025em;
  background:linear-gradient(170deg,#14203A 25%,#3559E0 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sv{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 13px 7px 9px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.sv svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2}
.sv b{color:var(--ink);font-weight:700}
.lang{flex:0 0 auto;display:flex;border-radius:999px;padding:3px;margin-top:2px}
.lang button{border:0;background:none;border-radius:999px;min-height:36px;min-width:44px;padding:6px 12px;font-size:12.5px;font-weight:800;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 10px rgba(20,32,58,.25)}

.wrap{max-width:620px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:18px;padding:5px;gap:5px}
.tab{border:0;background:none;border-radius:14px;min-height:46px;padding:11px 8px;font-weight:700;font-size:15px;color:var(--muted);position:relative}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 18px -6px rgba(70,70,220,.55)}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:13px 13px 6px 6px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}

/* Summary */
.summary{display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px 14px;border-radius:18px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:conic-gradient(from -90deg,#18B26B calc(var(--p)*1%),rgba(20,32,58,.08) 0);display:grid;place-items:center}
.ring::after{content:"";width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(20,32,58,.08) inset}
.count{margin:0;font-size:13.5px;color:var(--muted)}
.count b{display:block;color:var(--ink);font-size:16px}

/* Sections */
.sec{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(20,32,58,.15),transparent)}
.fold>summary{list-style:none;cursor:pointer;min-height:44px;margin:14px 0 4px;padding:0 4px;-webkit-user-select:none;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{order:1}
.fold .chev{order:2;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
.fold .chev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.fold[open] .chev svg{transform:rotate(180deg)}
.fold>.list{margin-top:6px}
.list{display:flex;flex-direction:column;gap:12px}

/* Cards */
.card{position:relative;display:grid;grid-template-columns:58px 1fr;gap:14px;border-radius:22px;padding:15px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.card>*{position:relative}
.card.today{border-color:rgba(242,169,59,.7);background:linear-gradient(160deg,rgba(255,226,150,.55),var(--glass) 60%)}
.card.isdone{box-shadow:var(--shadow),inset 4px 0 0 #18B26B}

/* calendar tile */
.tile{border-radius:13px;overflow:hidden;text-align:center;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);align-self:start;box-shadow:0 4px 12px -4px rgba(40,60,120,.25)}
.tile small{display:block;background:var(--tile-top);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 0}
.tile b{display:block;font-weight:800;font-size:24px;line-height:1.1;padding-top:4px;color:var(--ink)}
.tile i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:5px}
.card.today .tile small{background:linear-gradient(135deg,#FFC24B,#F29A2E);color:#4A2E00}
.card.past .tile small{background:linear-gradient(135deg,#8E9AB2,#6B7790)}

.info{min-width:0}
.name{min-height:24px;display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.time{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-top:3px;flex-wrap:wrap}
.time svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.badge{font-size:11px;font-weight:800;border-radius:7px;padding:2px 8px;background:linear-gradient(135deg,#FFC24B,#F29A2E);color:#4A2E00}
.note{display:flex;gap:7px;margin-top:9px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);font-size:13.5px;line-height:1.4;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
.note svg{width:14px;height:14px;flex:0 0 auto;margin-top:2px;stroke:var(--muted);fill:none;stroke-width:2}
.note span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.open{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:12px;background:rgba(53,89,224,.10);border:1px solid rgba(53,89,224,.18);color:var(--accent);font-weight:700;font-size:13.5px;text-decoration:none}
.open svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.nolink{font-size:13px;color:var(--red);font-weight:600}
.done{margin-left:auto;display:inline-flex;align-items:center;gap:9px;border:0;background:none;padding:4px 0 4px 4px;min-height:40px;font-size:13.5px;font-weight:700;color:var(--muted)}
.sw{position:relative;flex:0 0 auto;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.20);box-shadow:inset 0 0 0 1px rgba(20,32,58,.06);transition:background .25s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.7,.4,1.2),width .15s ease}
.done:active .sw::after{width:33px}
.done[aria-checked="true"] .sw{background:#34C759}
.done[aria-checked="true"] .sw::after{transform:translateX(20px)}
.done[aria-checked="true"]:active .sw::after{transform:translateX(14px)}
.done[aria-checked="true"]{color:#1E9E4A}
.done:disabled{cursor:default}
.done:disabled .sw{opacity:.75}
.empty{text-align:center;color:var(--muted);padding:34px 14px;border-radius:22px;margin-top:16px}

/* sticky add */
.addbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%);position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10;
  background:linear-gradient(rgba(238,241,250,0),rgba(238,241,250,.85) 45%)}
.add{position:relative;overflow:hidden;display:block;width:100%;min-height:56px;max-width:588px;margin:0 auto;border:0;border-radius:18px;padding:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:16px;letter-spacing:.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 14px 30px -10px rgba(80,70,220,.65)}
.add::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:17px 17px 8px 8px;background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0));pointer-events:none}

/* Sheet */
dialog{max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid rgba(255,255,255,.9);padding:0;border-radius:26px;color:var(--ink);width:min(480px,calc(100vw - 24px));
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);box-shadow:0 30px 80px -10px rgba(30,40,90,.45)}
dialog::backdrop{background:rgba(30,40,80,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
form{padding:22px}
form h2{font-weight:800;font-size:22px;margin:0 0 16px;letter-spacing:-.015em}
form h2:focus{outline:none}
label{display:block;font-size:14px;margin-bottom:13px}
label b{font-weight:700}
label span{font-weight:400;color:var(--muted)}
input,textarea{-webkit-appearance:none;appearance:none;min-height:48px;text-align:left;display:block;width:100%;margin-top:6px;border:1px solid rgba(20,32,58,.10);background:var(--field);border-radius:14px;padding:11px 13px;font-size:16px;box-shadow:0 1px 2px rgba(20,32,58,.05) inset}
textarea{min-height:84px;resize:vertical;line-height:1.45;font-family:inherit}
input::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
input::-webkit-calendar-picker-indicator{opacity:.6}
input:focus,textarea:focus{border-color:var(--accent);outline:none;background:#fff;box-shadow:0 0 0 4px rgba(53,89,224,.14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{position:relative;overflow:hidden;flex:1;border:1px solid rgba(20,32,58,.12);background:rgba(255,255,255,.7);border-radius:15px;padding:13px;font-weight:700;min-height:50px}
.btn.save{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 22px -8px rgba(80,70,220,.6)}
.btn.save::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:14px 14px 6px 6px;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.del{display:block;min-height:44px;padding:8px 14px;margin:8px auto 0;border:0;background:none;color:var(--red);font-size:14px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,32,58,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px);z-index:50;box-shadow:0 10px 30px -8px rgba(20,32,58,.5)}
.toast.show{opacity:1}
.add:active,.btn:active,.open:active,.tab:active{transform:scale(.97)}
.add,.btn,.open,.done,.tab{transition:transform .12s ease,box-shadow .2s}
@media (hover:hover){.open:hover{background:rgba(53,89,224,.16)}.add:hover{filter:brightness(1.05)}}
@media (max-width:520px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:92dvh;border-bottom:0}
  dialog[open]{animation:up .24s ease-out}
  form{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  form::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:rgba(20,32,58,.18);margin:0 auto 14px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* ---- Fluid phone scale: comfortable from 320px to 430px, capped on tablets ---- */
body{font-size:clamp(15px,4vw,16px)}
.band{padding:calc(env(safe-area-inset-top,0px) + clamp(16px,5vw,22px)) 0 clamp(12px,3.5vw,16px)}
.band p{font-size:clamp(11px,3vw,12.5px)}
h1{font-size:clamp(23px,6.8vw,30px)}
.sv{font-size:clamp(12.5px,3.4vw,13.5px);margin-top:clamp(8px,2.6vw,12px)}
.tab{font-size:clamp(13.5px,3.7vw,15px);min-height:44px;padding:10px 6px}
.summary{padding:clamp(10px,3vw,12px) clamp(12px,3.6vw,14px)}
.ring{width:clamp(40px,11vw,46px);height:clamp(40px,11vw,46px)}
.ring::after{width:calc(100% - 12px);height:calc(100% - 12px)}
.count b{font-size:clamp(14.5px,4vw,16px)}
.count{font-size:clamp(12.5px,3.4vw,13.5px)}
.card{grid-template-columns:clamp(48px,13.5vw,58px) 1fr;gap:clamp(10px,3.2vw,14px);padding:clamp(12px,3.6vw,15px);border-radius:clamp(18px,5vw,22px)}
.tile b{font-size:clamp(20px,5.8vw,24px)}
.tile small{font-size:clamp(9.5px,2.6vw,10.5px)}
.tile i{font-size:clamp(10px,2.8vw,11px)}
.name{font-size:clamp(15px,4.1vw,16.5px)}
.time{font-size:clamp(13px,3.5vw,14px)}
.note{font-size:clamp(12.5px,3.4vw,13.5px)}
.row{gap:6px 8px;margin-top:clamp(9px,2.8vw,12px)}
.open{font-size:clamp(12.5px,3.4vw,13.5px);padding:7px clamp(10px,3vw,14px);min-height:38px;border-radius:11px}
.done{font-size:clamp(12.5px,3.4vw,13.5px);gap:8px}
.add{min-height:52px;font-size:clamp(15px,4vw,16px);border-radius:16px}
.addbar{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
form h2{font-size:clamp(19px,5.4vw,22px)}
label{font-size:clamp(13px,3.6vw,14px);margin-bottom:12px}
input,textarea{min-height:46px;padding:10px 12px}
.btn{min-height:48px;padding:12px}
@media (max-width:400px){
  .sw{width:46px;height:28px}.sw::after{width:24px;height:24px}
  .done[aria-checked="true"] .sw::after{transform:translateX(18px)}
  .done:active .sw::after{width:29px}
  .done[aria-checked="true"]:active .sw::after{transform:translateX(13px)}
  .row{gap:6px}.done{gap:6px}
  .open{padding:7px 9px;gap:5px}
}
@media (max-width:350px){.two{grid-template-columns:1fr}}
/* header: language switch pinned top-right so the supervisor pill gets full width */
.band .inner{position:relative;display:block}
.band .lang{position:absolute;top:0;right:max(18px,env(safe-area-inset-right,0px));margin:0}
.band p,.band h1{padding-right:112px}
/* small edit button on each card */
.edit{position:absolute;z-index:2;top:clamp(9px,2.6vw,12px);right:clamp(9px,2.6vw,12px);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);color:var(--muted);box-shadow:0 2px 8px -2px rgba(40,60,120,.25);padding:0}
.edit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.edit::before{content:"";position:absolute;inset:-6px}
.edit:active{transform:scale(.92)}
@media (hover:hover){.edit:hover{color:var(--accent);background:#fff}}
.card.can-edit .name,.card.can-edit .time{padding-right:38px}
/* keep link + switch on one line */
.row{flex-wrap:nowrap}
.open{min-width:0;flex:0 1 auto;overflow:hidden}
.open .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open svg{flex:0 0 auto}
.nolink{min-width:0;flex:0 1 auto}
.done{flex:0 0 auto;white-space:nowrap}
.sv{white-space:nowrap;max-width:100%}
.band .inner>div:first-child{min-width:0}
@media (max-width:350px){.done .dl{display:none}}
/* Short screens / landscape phones: keep the form reachable */
@media (max-height:520px){
  .addbar{position:static;padding:8px 0 0;background:none}
  .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  dialog{max-height:calc(100dvh - 12px)}
  textarea{min-height:60px}
}
/* Tablet / desktop: don't let things balloon */
@media (min-width:700px){
  .wrap,.band .inner{max-width:600px}
}

/* ===== Compact scale (≈15% smaller, still thumb-friendly) ===== */
body{font-size:clamp(14px,3.7vw,15px)}
.band{padding:calc(env(safe-area-inset-top,0px) + clamp(12px,3.6vw,16px)) 0 clamp(10px,3vw,12px)}
.band p{font-size:clamp(10px,2.7vw,11px);margin-bottom:2px}
h1{font-size:clamp(20px,5.6vw,24px)}
.band p,.band h1{padding-right:96px}
.sv{font-size:clamp(11.5px,3.1vw,12.5px);margin-top:8px;padding:5px 11px 5px 8px;gap:6px}
.sv svg{width:14px;height:14px}
.lang button{min-height:32px;min-width:40px;padding:4px 10px;font-size:11.5px}
.tabs{border-radius:15px;padding:4px;gap:4px}
.tab{min-height:38px;padding:8px 6px;font-size:clamp(12.5px,3.4vw,13.5px);border-radius:11px}
.tab[aria-selected="true"]::after{border-radius:10px 10px 5px 5px}
.summary{margin:10px 0 2px;padding:9px 12px;gap:11px;border-radius:15px}
.ring{width:36px;height:36px}
.ring::after{width:26px;height:26px}
.count b{font-size:clamp(13.5px,3.6vw,14.5px)}
.count{font-size:clamp(11.5px,3.1vw,12.5px)}
.sec{margin:16px 4px 8px;font-size:11px}
.fold>summary{min-height:40px;margin:10px 0 2px}
.fold .chev{padding:5px 10px;font-size:11.5px}
.list{gap:9px}
.card{grid-template-columns:clamp(42px,11.5vw,48px) 1fr;gap:clamp(9px,2.8vw,12px);padding:clamp(10px,3vw,12px);border-radius:clamp(15px,4.2vw,18px)}
.tile{border-radius:10px}
.tile small{font-size:clamp(8.5px,2.3vw,9.5px);padding:2px 0}
.tile b{font-size:clamp(17px,4.8vw,20px);padding-top:2px}
.tile i{font-size:clamp(9px,2.5vw,10px);padding-bottom:3px}
.name{font-size:clamp(14px,3.8vw,15px);min-height:0}
.time{font-size:clamp(12px,3.2vw,13px);margin-top:2px;gap:5px}
.time svg{width:13px;height:13px}
.badge{font-size:10px;padding:1px 7px}
.note{font-size:clamp(12px,3.2vw,12.5px);margin-top:7px;padding:7px 9px;border-radius:10px}
.note svg{width:13px;height:13px}
.row{margin-top:9px;gap:6px}
.open{min-height:34px;padding:6px 10px;font-size:clamp(12px,3.2vw,12.5px);border-radius:10px;gap:5px}
.open svg{width:13px;height:13px}
.nolink{font-size:12px}
.done{min-height:34px;font-size:clamp(12px,3.2vw,12.5px);gap:7px}
.sw{width:44px;height:26px}
.sw::after{width:22px;height:22px}
.done[aria-checked="true"] .sw::after{transform:translateX(18px)}
.done:active .sw::after{width:27px}
.done[aria-checked="true"]:active .sw::after{transform:translateX(13px)}
.edit{width:30px;height:30px;top:8px;right:8px}
.edit svg{width:13px;height:13px}
.card.can-edit .name,.card.can-edit .time{padding-right:32px}
.add{min-height:46px;font-size:clamp(14px,3.8vw,15px);border-radius:14px;padding:12px}
.add::after{border-radius:13px 13px 6px 6px}
.addbar{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.empty{padding:26px 12px;border-radius:16px}
.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px));font-size:13px;padding:9px 14px}
/* form: inputs stay 16px so iPhone does not auto-zoom */
form{padding:18px}
form h2{font-size:clamp(17px,4.8vw,19px);margin-bottom:12px}
label{font-size:clamp(12.5px,3.4vw,13px);margin-bottom:10px}
input,textarea{min-height:42px;padding:8px 11px;margin-top:4px;border-radius:12px}
textarea{min-height:70px}
.btns{margin-top:6px}
.btn{min-height:44px;padding:10px;border-radius:13px;font-size:14.5px}
.btn.save::after{border-radius:12px 12px 6px 6px}
.del{min-height:40px;font-size:13px;margin-top:4px}
@media (max-width:520px){
  form{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  form::before{margin-bottom:10px}
}
@media (max-height:520px){.addbar{padding:6px 0 0}}
/* live sync indicator */
.live{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:4px 9px;border-radius:999px;background:rgba(24,178,107,.10);color:#13804D;font-size:11px;font-weight:700;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:#18B26B;animation:pulse 2s infinite}
.live.off{background:rgba(242,169,59,.16);color:#8A5A00}
.live.off i{background:#F2A93B;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,178,107,.45)}70%{box-shadow:0 0 0 6px rgba(24,178,107,0)}100%{box-shadow:0 0 0 0 rgba(24,178,107,0)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="sky" aria-hidden="true"></div>
<div class="band">
  <div class="inner">
    <div>
      <p data-t="sub">Praktikum mengajar</p>
      <h1 data-t="title">Jadual pemerhatian</h1>
      <div class="sv glass"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span data-t="svLabel">Penyelia</span><b>Prof. Teh Ling</b></div>
    </div>
    <div class="lang glass" role="group" aria-label="Bahasa / Language">
      <button data-lang="ms" aria-pressed="true">BM</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</div>
<main class="wrap">
  <div class="tabs glass" role="tablist">
    <button class="tab" role="tab" data-obs="1" aria-selected="true" data-t="obs1">Pemerhatian 1</button>
    <button class="tab" role="tab" data-obs="2" aria-selected="false" data-t="obs2">Pemerhatian 2</button>
  </div>
  <div class="summary glass" id="summary" hidden><div class="ring" id="ring"></div><p class="count" id="count"></p><span class="live off" id="live" role="status" aria-live="polite"><i></i><span id="liveTxt"></span></span></div>
  <p class="count" id="status" data-t="loading" style="margin:18px 4px">Memuatkan…</p>
  <div id="list"></div>
</main>
<div class="addbar" id="addbar" hidden><button class="add" id="add" data-t="add">+ Tambah jadual saya</button></div>

<dialog id="dlg">
  <form id="form">
    <h2 id="ftitle" tabindex="-1" autofocus>Tambah jadual</h2>
    <label><b data-t="fName">Nama penuh</b><input name="nama" required maxlength="120" autocomplete="name"></label>
    <label><b data-t="fDate">Tarikh</b><input name="tarikh" type="date" required></label>
    <div class="two">
      <label><b data-t="fStart">Mula</b><input name="mula" type="time" required></label>
      <label><b data-t="fEnd">Tamat</b><input name="tamat" type="time"></label>
    </div>
    <label><b data-t="fLink">Pautan video / RPH / Meet</b> <span data-t="fLinkHint">(boleh isi kemudian)</span><input name="pautan" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://"></label>
    <label><b data-t="fNote">Catatan</b> <span data-t="fNoteHint">(pilihan)</span><textarea name="catatan" rows="3" maxlength="500" data-tp="notePh" placeholder="Contoh: subjek, kelas, topik"></textarea></label>
    <div class="btns">
      <button type="button" class="btn" id="cancel" data-t="cancel">Tutup</button>
      <button type="submit" class="btn save" id="save" data-t="save">Simpan</button>
    </div>
    <button type="button" class="del" id="del" hidden data-t="del">Padam jadual ini</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const T={
 ms:{liveOn:'Langsung',liveOff:'Menyambung…',show:'Tunjuk',hide:'Sorok',svLabel:'Penyelia:',sub:'Praktikum mengajar',upcoming:'Akan datang',past:'Sudah berlalu',title:'Jadual pemerhatian',obs1:'Pemerhatian 1',obs2:'Pemerhatian 2',add:'+ Tambah jadual saya',loading:'Memuatkan…',
  fName:'Nama penuh',fDate:'Tarikh',fStart:'Mula',fEnd:'Tamat',fLink:'Pautan video / RPH / Meet',fLinkHint:'(boleh isi kemudian)',fNote:'Catatan',fNoteHint:'(pilihan)',notePh:'Contoh: subjek, kelas, topik',
  cancel:'Tutup',save:'Simpan',del:'Padam jadual ini',addTitle:'Tambah jadual',editTitle:'Ubah jadual',
  count:(n,d)=>'<b>'+d+' / '+n+' selesai dinilai</b>'+(n-d)+' lagi menunggu',empty:'Belum ada jadual. Tekan "Tambah jadual saya" untuk mula.',
  failed:'Jadual tidak dapat dimuatkan. Semak sambungan internet dan muat semula halaman.',setup:'Laman ini belum disambungkan ke pangkalan data. Pemilik perlu isi fail firebase-config.js (lihat README).',
  today:'Hari ini',open:'Buka pautan',meet:'Sertai Meet',nolink:'Tiada pautan lagi',done:'Selesai',
  days:['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'],months:['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'],
  badLink:'Pautan tidak sah. Semak semula.',longLink:'Pautan terlalu panjang (maksimum 500 aksara). Guna pautan pendek.',saved:'Disimpan.',deleted:'Dipadam.',confirmDel:n=>'Padam jadual '+n+'?',
  readonly:'Perubahan tidak dibenarkan oleh tetapan pangkalan data.',badName:'Sila isi nama penuh.',badTime:'Masa tamat mesti selepas masa mula.',dupe:'Nama ini sudah ada. Sila ubah jadual sedia ada.',conn:'Sambungan terputus. Sila muat semula halaman.',gone:'Jadual ini telah dipadam oleh pengguna lain.',full:'Ruang simpanan penuh. Padam jadual lama dahulu.',dupeEdit:'Nama ini sudah ada dalam senarai.',saveFail:'Tidak dapat menyimpan. Cuba sekali lagi.'},
 en:{liveOn:'Live',liveOff:'Reconnecting…',show:'Show',hide:'Hide',svLabel:'Supervisor:',sub:'Teaching practicum',upcoming:'Upcoming',past:'Past',title:'Observation schedule',obs1:'Observation 1',obs2:'Observation 2',add:'+ Add my schedule',loading:'Loading…',
  fName:'Full name',fDate:'Date',fStart:'Start',fEnd:'End',fLink:'Video / lesson plan / Meet link',fLinkHint:'(can be added later)',fNote:'Note',fNoteHint:'(optional)',notePh:'Example: subject, class, topic',
  cancel:'Close',save:'Save',del:'Delete this schedule',addTitle:'Add schedule',editTitle:'Edit schedule',
  count:(n,d)=>'<b>'+d+' / '+n+' observed</b>'+(n-d)+' still waiting',empty:'No schedules yet. Tap "Add my schedule" to start.',
  failed:'The schedule could not load. Check your internet connection and reload.',setup:'This site is not connected to its database yet. The owner needs to fill in firebase-config.js (see README).',
  today:'Today',open:'Open link',meet:'Join Meet',nolink:'No link yet',done:'Done',
  days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  badLink:'That link is not valid. Please check it.',longLink:'That link is too long (max 500 characters). Use a shorter link.',saved:'Saved.',deleted:'Deleted.',confirmDel:n=>'Delete the schedule for '+n+'?',
  readonly:'Changes are not allowed by the database settings.',badName:'Please enter your full name.',badTime:'End time must be after start time.',dupe:'This name already has a schedule. Please edit the existing one.',conn:'Connection lost. Please reload the page.',gone:'This schedule was deleted by someone else.',full:'Storage is full. Delete old schedules first.',dupeEdit:'This name is already in the list.',saveFail:'Could not save. Please try again.'}
};
let LANG='ms';try{if(localStorage.getItem('lang')==='en')LANG='en';}catch(e){}
const L=k=>T[LANG][k];
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=L(el.dataset.t);});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=L(el.dataset.tp);});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  document.title=L('title')+' | Prof. Teh Ling';
  const lt=document.getElementById('liveTxt');if(lt)lt.textContent=S.live?L('liveOn'):L('liveOff');
}
const S={live:false,pastOpen:false,rows:[],obs:1,db:null,canWrite:true,loaded:false,failed:false,editing:null,busy:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dObj=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
function fmtTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+' '+ap;}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'rekod';}
function titleName(s){return s.trim().replace(/\s+/g,' ').split(' ').map(w=>/^(bin|binti|bt|a\/l|a\/p)$/i.test(w)?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
function safeUrl(u){u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return'';}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000);}

const clock='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const noteIc='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>';
const pencil='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>';
const ext='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function card(r,t,writable){
  const d=dObj(r.tarikh||t), url=safeUrl(r.pautan);
  const cls=['card'];if(r.tarikh===t)cls.push('today');else if(r.tarikh<t)cls.push('past');if(r.dinilai)cls.push('isdone');if(writable)cls.push('can-edit');
  const live=r.mod==='langsung'||/meet\.google|zoom\.us/i.test(url);
  return '<div class="'+cls.join(' ')+' glass">'+
    '<div class="tile"><small>'+L('days')[d.getDay()]+'</small><b>'+d.getDate()+'</b><i>'+L('months')[d.getMonth()]+'</i></div>'+
    (writable?'<button class="edit" data-edit="'+esc(r.id)+'" aria-label="'+esc(L('editTitle')+': '+r.nama)+'" title="'+esc(L('editTitle'))+'">'+pencil+'</button>':'')+
    '<div class="info">'+
      (writable?'<button class="name" data-edit="'+esc(r.id)+'">'+esc(r.nama)+'</button>':'<span class="name">'+esc(r.nama)+'</span>')+
      '<div class="time">'+clock+esc(fmtTime(r.mula))+(r.tamat?' – '+esc(fmtTime(r.tamat)):'')+(r.tarikh===t?' <span class="badge">'+L('today')+'</span>':'')+'</div>'+
      (r.catatan?'<div class="note">'+noteIc+'<span>'+esc(r.catatan)+'</span></div>':'')+
      '<div class="row">'+
        (url?'<a class="open" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+ext+'<span class="lbl">'+(live?L('meet'):L('open'))+'</span></a>':'<span class="nolink">'+L('nolink')+'</span>')+
        '<button class="done" role="switch" data-done="'+esc(r.id)+'" aria-checked="'+(!!r.dinilai)+'" aria-label="'+esc(L('done')+': '+r.nama)+'"'+(writable?'':' disabled')+'><span class="dl">'+L('done')+'</span><span class="sw" aria-hidden="true"></span></button>'+
      '</div>'+
    '</div></div>';
}
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(+t.dataset.obs===S.obs)));
  const writable=!!(S.db&&S.canWrite);
  $('#addbar').hidden=!writable;
  const st=$('#status');
  if(S.failed){st.hidden=false;st.textContent=L(S.failed==='setup'?'setup':'failed');$('#summary').hidden=true;setList('');return;}
  if(!S.loaded){st.hidden=false;return;}
  st.hidden=true;
  const t=today();
  const rows=S.rows.filter(r=>Number(r.pemerhatian||1)===S.obs)
    .sort((a,b)=>(a.tarikh||'').localeCompare(b.tarikh||'')||(a.mula||'').localeCompare(b.mula||''));
  const done=rows.filter(r=>r.dinilai).length;
  $('#summary').hidden=!rows.length;
  if(rows.length){$('#count').innerHTML=L('count')(rows.length,done);$('#ring').style.setProperty('--p',Math.round(done/rows.length*100));}
  if(!rows.length){setList('<p class="empty glass">'+esc(L('empty'))+'</p>');return;}
  const up=rows.filter(r=>r.tarikh>=t), past=rows.filter(r=>r.tarikh<t);
  let h='';
  if(up.length)h+='<div class="sec">'+L('upcoming')+' ('+up.length+')</div><div class="list">'+up.map(r=>card(r,t,writable)).join('')+'</div>';
  if(past.length)h+='<details class="fold" id="pastFold"'+(S.pastOpen?' open':'')+'><summary class="sec">'+L('past')+' ('+past.length+')<span class="chev">'+(S.pastOpen?L('hide'):L('show'))+'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></summary><div class="list">'+past.slice().reverse().map(r=>card(r,t,writable)).join('')+'</div></details>';
  setList(h);
}
let lastList='';
function setList(h){if(h===lastList)return;lastList=h;$('#list').innerHTML=h;}
function setLive(on){S.live=on;$('#live').classList.toggle('off',!on);$('#liveTxt').textContent=on?L('liveOn'):L('liveOff');}

async function writeErr(e,id){
  const code=e&&e.code;
  if(code==='not-found'){toast(L('gone'));if($('#dlg').open)$('#dlg').close();return;}
  if(code==='permission-denied'){
    let gone=id&&!S.rows.some(x=>x.id===id);
    if(id&&!gone){try{gone=!(await S.db.collection('sesi').doc(id).get()).exists;}catch(_){}}
    if(gone){toast(L('gone'));if($('#dlg').open)$('#dlg').close();return;}
    toast(L('readonly'));return;
  }
  if(code==='resource-exhausted')toast(L('full'));
  else toast(L('saveFail'));
}
// Transient platform hiccup: retry a write once after a short random delay
async function withRetry(fn){
  try{return await fn();}
  catch(e){if(e&&(e.code==='unavailable'||e.code==='deadline-exceeded'||e.code==='aborted')){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn();}throw e;}
}
function openForm(id,keepInput){
  const f=$('#form');if(!keepInput)f.reset();S.editing=id||null;
  const r=id&&S.rows.find(x=>x.id===id);
  $('#ftitle').textContent=r?L('editTitle'):L('addTitle');
  $('#del').hidden=!r;
  if(r&&!keepInput){f.nama.value=r.nama||'';f.tarikh.value=r.tarikh||'';f.mula.value=r.mula||'';f.tamat.value=r.tamat||'';f.pautan.value=r.pautan||'';f.catatan.value=r.catatan||'';}
  if(!$('#dlg').open)$('#dlg').showModal();document.documentElement.classList.add('lock');
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  const nama=titleName(f.nama.value),pautan=safeUrl(f.pautan.value);
  if(!nama){toast(L('badName'));f.nama.focus();return;}
  if(f.pautan.value.trim()&&!pautan){toast(L('badLink'));return;}
  if(pautan.length>500){toast(L('longLink'));f.pautan.focus();return;}
  if(f.tamat.value&&f.tamat.value<=f.mula.value){toast(L('badTime'));return;}
  const old=S.editing&&S.rows.find(x=>x.id===S.editing);
  const obsNo=old?Number(old.pemerhatian||1):S.obs;
  const dup=S.rows.find(x=>x.id!==S.editing&&Number(x.pemerhatian||1)===obsNo&&slug(x.nama||'')===slug(nama));
  if(dup&&!old){toast(L('dupe'));openForm(dup.id,true);return;} // keep what they typed, switch to editing their existing record
  if(dup&&old){toast(L('dupeEdit'));f.nama.focus();return;}
  const data={nama,pemerhatian:old?Number(old.pemerhatian||1):S.obs,tarikh:f.tarikh.value,mula:f.mula.value,tamat:f.tamat.value||'',pautan,
    mod:/meet\.google|zoom\.us/i.test(pautan)?'langsung':'video',catatan:f.catatan.value.trim().slice(0,500),dinilai:old?!!old.dinilai:false,dikemaskini:Date.now()};
  let id=S.editing;
  if(!id){const base=slug(nama)+'-p'+S.obs;id=base;let n=2;while(S.rows.some(r=>r.id===id))id=base+'-'+(n++);}
  $('#save').disabled=true;
  try{
    const ref=S.db.collection('sesi').doc(id);
    if(old){const{nama:a,tarikh:b,mula:c,tamat:d,pautan:e2,mod:m,catatan:n2,dikemaskini:k}=data;await withRetry(()=>ref.update({nama:a,tarikh:b,mula:c,tamat:d,pautan:e2,mod:m,catatan:n2,dikemaskini:k}));}

  if(t.dataset.lang){LANG=t.dataset.lang;try{localStorage.setItem('lang',LANG);}catch(err){}applyLang();render();return;}
  if(t.dataset.obs){S.obs=+t.dataset.obs;render();return;}
  if(!(S.db&&S.canWrite))return;
  if(t.dataset.edit)openForm(t.dataset.edit);
  else if(t.dataset.done){
    const id=t.dataset.done,r=S.rows.find(x=>x.id===id);if(!r||S.busy.has(id))return;
    S.busy.add(id);
    const next=!r.dinilai;
    t.setAttribute('aria-checked',String(next));
    await new Promise(res=>setTimeout(res,260)); // let the switch slide before the list refreshes
    try{await withRetry(()=>S.db.collection('sesi').doc(id).update({dinilai:next,dikemaskini:Date.now()}));}

    finally{S.busy.delete(id);}
  }
});

function checkUpdate(){
  if($('#dlg').open)return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===APP_VERSION||$('#dlg').open)return;
    try{if(sessionStorage.getItem('upd')===j.v)return;sessionStorage.setItem('upd',j.v);}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(j.v));
  }).catch(()=>{});
}

  // First run only: load the original schedule (from the WhatsApp list) into the database
  try{
    const meta=db.collection('meta').doc('seed');
    const m=await meta.get();

      const batch=db.batch();
      Object.entries(SEED).forEach(([id,d])=>batch.set(db.collection('sesi').doc(id),Object.assign({},d,{dikemaskini:Date.now()})));

      await batch.commit();
    }
  }catch(e){console.warn('seed skipped',e);}
  let retries=0,unsub=null;
  const subscribe=()=>db.collection('sesi').onSnapshot({includeMetadataChanges:true},snap=>{
      retries=0;setLive(!snap.metadata.fromCache);
      S.rows=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;render();
    },err=>{
      const code=err&&err.code;setLive(false);
      if(code!=='permission-denied'&&retries<3){retries++;setTimeout(()=>{unsub=subscribe();},1500*retries);return;}

    });
